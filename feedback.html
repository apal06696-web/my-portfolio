<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Feedback — Ankit Pal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html">Ankit Pal</a>
      <nav class="nav" id="mainNav">
        <a href="index.html#home">Home</a>
        <a href="index.html#projects">Projects</a>
        <a href="index.html#about">About</a>
        <a href="index.html#skills">Skills</a>
        <a href="index.html#contact">Contact</a>
        <a href="feedback.html">Feedback</a>
      </nav>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">☰</button>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <h1 class="section-title">Feedback</h1>
        <p class="lead">I appreciate all feedback — suggestions, bug reports, or ideas for improvement. Leave your note below and it will be stored locally in your browser.</p>

        <div style="display:grid;grid-template-columns:1fr 360px;gap:1rem;align-items:start">
          <div>
            <form id="feedbackForm" class="contact-form" aria-label="Feedback form" data-endpoint="http://localhost:3000/submit-feedback">
              <label><span>Name</span><input type="text" name="name" placeholder="Your name (optional)"></label>
              <label><span>Email</span><input type="email" name="email" placeholder="your@email.com (optional)"></label>
              <label><span>Rating</span>
                <select name="rating" style="margin-top:.4rem;padding:.6rem;border-radius:8px;background:transparent;color:inherit;border:1px solid rgba(255,255,255,0.04)">
                  <option value="">Select</option>
                  <option value="5">5 — Excellent</option>
                  <option value="4">4 — Very good</option>
                  <option value="3">3 — Good</option>
                  <option value="2">2 — Fair</option>
                  <option value="1">1 — Poor</option>
                </select>
              </label>
              <label><span>Message</span><textarea name="message" rows="6" required placeholder="Share your feedback..."></textarea></label>
              <div class="form-actions">
                <button type="submit" class="btn primary">Submit Feedback</button>
                <div id="formStatusFeedback" class="form-status" aria-live="polite"></div>
              </div>
            </form>
          </div>

          <div>
            <h3 style="margin-top:0">Recent feedback</h3>
            <div id="feedbackList"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <small>© <span id="year"></span> Ankit. Built with care.</small>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
